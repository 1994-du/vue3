# Gitee Go 流水线：master 分支推送后自动构建，并用 scp 直传到服务器
#
# 为什么不用 deploy@agent（主机部署）：该步骤在这套环境里始终无法把任务派发到
# 主机组（三种 hostGroupID 写法都失败，agent 本身在线且心跳正常），
# 所以改为在构建步骤里直接 scp 推送，链路最短、成败可自查。
#
# ── 关键约定 ──────────────────────────────────────────────────────────────
# 1. .ci/deploy_key 是**专用 CI 私钥**，服务器 authorized_keys 里带 restrict 限制
#    （禁止端口转发/pty/agent 转发），泄露影响面被压到最小。
#    轮换方法：重新生成密钥对 → 替换仓库里的 .ci/deploy_key → 把新公钥追加到
#    服务器 /root/.ssh/authorized_keys。
# 2. 服务器目标目录写死在下面的脚本里：/var/www/html/Vue3，换机器改那里即可。
# 3. 构建机环境不依赖平台：Node 20 自带安装（npmmirror 镜像），
#    scp/ssh 缺失时会尝试 apt 安装 openssh-client。
# ──────────────────────────────────────────────────────────────────────────

version: '1.0'
name: vue3-master-deploy
displayName: Vue3 构建部署

triggers:
  trigger: auto
  push:
    branches:
      precise:
        - master

stages:
  - name: stage-build-and-deploy
    displayName: 编译并部署
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@nodejs
        name: build_nodejs
        displayName: Node.js 构建与发布
        # nodeVersion 写大版本号（如 '20'）会导致平台工具供应失败、npm 不在 PATH，
        # 所以下面第一条命令直接自装 Node 20，不依赖平台预装
        nodeVersion: '20'
        commands:
          # ── 自装 Node 20（构建机为 linux-x64；换 arm64 需改包名）────────
          - export NODE_DIR=$HOME/node20 && mkdir -p $NODE_DIR
          - >-
            curl -fsSL
            https://registry.npmmirror.com/-/binary/node/v20.18.1/node-v20.18.1-linux-x64.tar.gz
            | tar -xz -C $NODE_DIR --strip-components=1
          - export PATH=$NODE_DIR/bin:$PATH && node -v && npm -v
          # ── 构建 ──────────────────────────────────────────────
          # 使用国内镜像源，避免 Gitee 构建机访问官方源超时
          - npm config set registry https://registry.npmmirror.com
          - npm ci
          # 类型检查：本地 vite build 不查类型，这一关只在 CI 里跑
          - npm run typecheck
          - npm run build
          # ── 打包 ──────────────────────────────────────────────
          - tar -czf dist.tar.gz dist && ls -lh dist.tar.gz
          # ── 传输工具保障（个别镜像没带 openssh-client）────────
          - command -v scp || (apt-get update -qq && apt-get install -y -qq openssh-client) || true
          - mkdir -p ~/.ssh && cp .ci/deploy_key ~/.ssh/id_ci && chmod 600 ~/.ssh/id_ci
          # ── scp 推送 + 远端解压上线 ───────────────────────────
          - >-
            scp -i ~/.ssh/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=30 dist.tar.gz root@106.15.207.57:/tmp/vue3-dist.tar.gz
          - >-
            ssh -i ~/.ssh/id_ci -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
            root@106.15.207.57
            "mkdir -p /var/www/html/Vue3 &&
            find /var/www/html/Vue3 -mindepth 1 -delete &&
            tar -xzf /tmp/vue3-dist.tar.gz -C /var/www/html/Vue3 --strip-components=1 &&
            rm -f /tmp/vue3-dist.tar.gz &&
            echo DEPLOY_OK_$(date +%F_%T)"
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./dist
        caches:
          - ~/.npm
        notify: []
        strategy:
          retry: '0'
