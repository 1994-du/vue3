name: Deploy Vue3

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 部署总时长保险丝：历史正常全程 ~1 分钟，超过 15 分钟必定是传输卡死
    timeout-minutes: 15
    # 同组并发：新 push 触发的运行会自动取消还在挂着的旧运行，
    # 避免一次传输停滞把后续部署全堵在队列里
    concurrency:
      group: deploy-vue3
      cancel-in-progress: true

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 生产依赖审计
        run: npm run audit:prod

      - name: 打包项目
        run: npm run build

      - name: 上传到服务器
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "/var/www/html/Vue3"
          strip_components: 1
          # SSH 连接/握手超时：连不上或中途停滞 60s 就报错退出，不再无限挂起
          timeout: 60s
