<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0E1A" />
    <title>Knowledge Engine</title>
    <!-- No webfonts: the type stack in design-system.scss resolves to the platform's
         own face (PingFang SC on Apple, Noto Sans SC on Android, YaHei on Windows),
         so nothing has to come over the network before first paint. -->
    <style>
      html, body, #vue3 { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      html, body { background-color: #0a0e1a; font-variant-numeric: tabular-nums; }
      html[data-theme='light'], html[data-theme='light'] body { background-color: #edeef1; }
      * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="vue3"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
